<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGRSI — Nuevo componente</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="formulario.css">
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="logo.png" alt="Logo SGRSI" class="sidebar-logo">
      <span class="sidebar-nombre">Lux</span>
    </div>
    <nav class="sidebar-nav" aria-label="Navegación principal">
      <ul>
        <li><a href="dashboard.html" class="nav-link"><span class="nav-icono">⊞</span> Inicio</a></li>
        <li><a href="inventario.html" class="nav-link activo"><span class="nav-icono">📦</span> Inventario</a></li>
        <li><a href="estado-equipos.html" class="nav-link"><span class="nav-icono">🖥</span> Estado de Equipos</a></li>
        <li><a href="tickets.html" class="nav-link"><span class="nav-icono">🎫</span> Tickets</a></li>
        <li><a href="prestamos.html" class="nav-link"><span class="nav-icono">📖</span> Préstamos</a></li>
        <li><a href="solicitudes.html" class="nav-link"><span class="nav-icono">✂</span> Solicitudes</a></li>
        <li><a href="perfil.html" class="nav-link"><span class="nav-icono">👤</span> Perfil</a></li>
      </ul>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-colapsar" id="btn-colapsar" type="button">‹ Colapsar</button>
    </div>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="layout">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="topbar-controles">
        <button class="ctrl-fuente" type="button" data-size="small">A</button>
        <button class="ctrl-fuente activo" type="button" data-size="medium">A</button>
        <button class="ctrl-fuente" type="button" data-size="large">A</button>
        <button class="ctrl-tema" type="button" id="btn-tema" aria-label="Cambiar tema">🌙</button>
      </div>
      <div class="topbar-usuario">
        <div class="usuario-avatar">MR</div>
        <div class="usuario-info">
          <span class="usuario-nombre">Marcela</span>
          <span class="usuario-rol">Administrador</span>
        </div>
      </div>
    </header>

    <!-- MAIN -->
    <main class="main-content">

      <section class="encabezado-formulario" aria-label="Encabezado">
        <a href="inventario.html" class="btn-volver">← Nuevo componente</a>
      </section>

      <section class="card formulario-card" aria-label="Formulario nuevo componente">
        <h2>Datos del componente</h2>

        <form class="formulario" action="#" method="post">

          <div class="fila-dos">
            <div class="campo">
              <label for="nombre-componente">Nombre del componente</label>
              <input type="text" id="nombre-componente" name="nombre_componente">
            </div>
            <div class="campo">
              <label for="modelo">Modelo</label>
              <input type="text" id="modelo" name="modelo">
            </div>
          </div>

          <div class="campo">
            <label for="fabricante">Fabricante</label>
            <input type="text" id="fabricante" name="fabricante">
          </div>

          <div class="fila-dos">
            <div class="campo">
              <label for="serie">N° de serie</label>
              <input type="text" id="serie" name="serie">
            </div>
            <div class="campo">
              <label for="part-number">Part number</label>
              <input type="text" id="part-number" name="part_number">
            </div>
          </div>

          <div class="fila-checks">
            <label class="check-label">
              <input type="checkbox" name="es_fabrica" checked>
              ¿Es de fábrica?
            </label>
            <label class="check-label">
              <input type="checkbox" name="funcionando" checked>
              ¿Está funcionando?
            </label>
          </div>

          <div class="acciones-formulario">
            <a href="inventario.html" class="btn-secundario">Cancelar</a>
            <button type="submit" class="btn-primario">Guardar</button>
          </div>

        </form>
      </section>

    </main>
  </div>

</body>
</html>
