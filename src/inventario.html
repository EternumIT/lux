<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGRSI — Inventario</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="inventario.css">
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <!-- SUGERENCIA: gestionar `nav-link activo` con JS en lugar de duplicar HTML en cada página.
         El botón `btn-colapsar` debe alternar clases/atributos por JS para accesibilidad. -->
    <div class="sidebar-brand">
      <img src="logo.png" alt="Logo SGRSI" class="sidebar-logo">
      <span class="sidebar-nombre">Lux</span>
    </div>

    <nav class="sidebar-nav" aria-label="Navegación principal">
      <ul>
        <li><a href="dashboard.html" class="nav-link"><span class="nav-icono">⊞</span> Inicio</a></li>
        <li><a href="inventario.html" class="nav-link activo"><span class="nav-icono">📦</span> Inventario</a></li>
        <li><a href="estado-equipos.html" class="nav-link"><span class="nav-icono">🖥</span> Estado de Equipos</a></li>
        <li><a href="tickets.html" class="nav-link"><span class="nav-icono">🎫</span> Tickets</a></li>
        <li><a href="prestamos.html" class="nav-link"><span class="nav-icono">📖</span> Préstamos</a></li>
        <li><a href="solicitudes.html" class="nav-link"><span class="nav-icono">🔧</span> Solicitudes</a></li>
        <li><a href="perfil.html" class="nav-link"><span class="nav-icono">👤</span> Perfil</a></li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <button class="btn-colapsar" id="btn-colapsar" type="button">‹ Colapsar</button>
    </div>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="layout">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="topbar-controles">
        <button class="ctrl-fuente" type="button" data-size="small">A</button>
        <button class="ctrl-fuente activo" type="button" data-size="medium">A</button>
        <button class="ctrl-fuente" type="button" data-size="large">A</button>
        <button class="ctrl-tema" type="button" id="btn-tema" aria-label="Cambiar tema">🌙</button>
      </div>
      <div class="topbar-usuario">
        <div class="usuario-avatar">MR</div>
        <div class="usuario-info">
          <span class="usuario-nombre">Marcela</span>
          <span class="usuario-rol">Administrador</span>
        </div>
      </div>
    </header>

    <!-- MAIN -->
    <main class="main-content">

      <section class="encabezado-pagina" aria-label="Encabezado de inventario">
        <div>
          <h1>Inventario</h1>
          <p class="subtitulo">Equipos y componentes del instituto</p>
        </div>
        <div class="acciones-encabezado">
          <a href="nuevo-componente.html" class="btn-secundario">⚙ Componente</a>
          <a href="nuevo-equipo.html" class="btn-primario">+ Nuevo equipo</a>
        </div>
      </section>

      <!-- FILTROS -->
      <section class="filtros-inventario" aria-label="Filtros de inventario">
        <input type="text" class="input-busqueda" placeholder="Buscar por marca, modelo, serie...">

        <select class="select-filtro" name="estado">
          <option value="">Todos los estados</option>
          <option value="operativo">Operativo</option>
          <option value="reparacion">En reparación</option>
          <option value="baja">De baja</option>
        </select>

        <select class="select-filtro" name="ubicacion">
          <option value="">Todas las ubicaciones</option>
          <option value="lab1">Laboratorio 1</option>
          <option value="lab2">Laboratorio 2</option>
          <option value="salones">Salones</option>
          <option value="administracion">Administración</option>
        </select>
      </section>

      <!-- TABS -->
      <section class="tabs-inventario" aria-label="Pestañas de inventario">
        <!-- JS: alternar contenido visible entre Equipos y Componentes -->
        <button class="tab-btn activo" type="button" data-tab="equipos">📦 Equipos (0)</button>
        <button class="tab-btn" type="button" data-tab="componentes">⚙ Componentes (0)</button>
      </section>

      <!-- CONTENIDO TABS -->
      <section class="contenido-tab" id="tab-equipos">
        <p class="mensaje-vacio">No se encontraron equipos</p>
        <!-- JS: aquí se renderiza la tabla/grid de equipos cuando haya datos -->
      </section>

      <section class="contenido-tab oculto" id="tab-componentes">
        <p class="mensaje-vacio">No se encontraron componentes</p>
        <!-- JS: aquí se renderiza la tabla/grid de componentes cuando haya datos -->
      </section>

    </main>
  </div>

</body>
</html>
