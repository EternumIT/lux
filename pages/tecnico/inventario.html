  <script>
    (function () {
      document.documentElement.setAttribute("data-perfil", "usuario");
      try {
        var p = JSON.parse(localStorage.getItem("eternum:prefs") || "{}");
        var prefiereOscuro = window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        var raiz = document.documentElement;
        raiz.setAttribute("data-theme", p.theme || (prefiereOscuro ? "dark" : "light"));

        /* El menú no es el mismo para todos los roles. Se resuelve acá, antes
           del primer pintado y no desde js/app.js, para que el usuario final
           no llegue a ver las secciones que no puede usar y el personal
           técnico no las vea desaparecer y volver en cada carga.
           Arranca en "usuario" (lo más restrictivo) y sube a "personal" solo
           si la sesión guardada lo confirma; cuando el servidor responde,
           js/app.js corrige el valor si hiciera falta. */
        var sesion = JSON.parse(localStorage.getItem("eternum:session") || "null");
        var personal = !!sesion && ["Root", "Administrador", "Tecnico"].indexOf(sesion.rol) !== -1;
        raiz.setAttribute("data-perfil", personal ? "personal" : "usuario");

        /* Lo mismo con el menú contraído: si esto se aplicara desde
           js/components/components.js, cada cambio de página mostraría el menú
           ancho un instante y después lo vería encogerse. */
        raiz.setAttribute("data-sidebar",
          localStorage.getItem("eternum:sidebarCollapsed") === "true" ? "contraida" : "abierta");
        raiz.setAttribute("data-font-size", p.fontSize || "medium");
        raiz.setAttribute("data-contrast", p.highContrast ? "high" : "normal");
        raiz.setAttribute("data-dyslexic", p.dyslexic ? "true" : "false");
      } catch (e) {
        /* Si el localStorage no está disponible se sigue con el tema por defecto. */
      }
    })();
  </script>
