<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGRSI — Nuevo componente</title>
  <link rel="stylesheet" href="../../assets/css/app.css">
</head>
<body data-page="inventario" class="flex min-h-screen items-start gap-4 p-4 max-md:flex-col">

  <aside class="barra-lateral" id="sidebar">

    <div class="marca-lateral">
      <img src="../../assets/img/logo.png" alt="Logo SGRSI" class="h-9 w-9 shrink-0 rounded-[10px]">
      <span class="marca-nombre">Lux</span>
    </div>

    <nav class="nav-lateral" aria-label="Navegación principal">
      <ul class="flex flex-col gap-1.5 list-none m-0 p-0">
        <li><a href="../dashboard/dashboard.html" class="nav-link" data-page="dashboard">
          <svg class="shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5L12 3l9 6.5"/><path d="M9 22V12h6v10"/></svg>
          <span class="nav-texto">Inicio</span>
        </a></li>
        <li><a href="../inventario/inventario.html" class="nav-link activo" data-page="inventario" aria-current="page">
          <svg class="shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73L12 3 4 6.27A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73L12 21l8-3.27A2 2 0 0 0 21 16z"/><path d="M7 9.5l10 4"/></svg>
          <span class="nav-texto">Inventario</span>
        </a></li>
        <li><a href="../equipment-status/equipment-status.html" class="nav-link" data-page="equipment-status">
          <svg class="shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/></svg>
          <span class="nav-texto">Estado de Equipos</span>
        </a></li>
        <li><a href="../tickets/tickets.html" class="nav-link" data-page="tickets">
          <svg class="shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10v4a2 2 0 0 1-2 2h-1"/><path d="M3 10v4a2 2 0 0 0 2 2h1"/><path d="M7 12h10"/></svg>
          <span class="nav-texto">Tickets</span>
        </a></li>
        <li><a href="../prestamos/prestamos.html" class="nav-link" data-page="prestamos">
          <svg class="shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v14"/><path d="M7 7h10"/></svg>
          <span class="nav-texto">Préstamos</span>
        </a></li>
        <li><a href="../solicitudes/solicitudes.html" class="nav-link" data-page="solicitudes">
          <svg class="shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 12.3a4 4 0 1 0-5.6 5.6l5.6-5.6z"/><path d="M20 14v7h-7"/></svg>
          <span class="nav-texto">Solicitudes</span>
        </a></li>
        <li><a href="../profile/profile.html" class="nav-link" data-page="profile">
          <svg class="shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="nav-texto">Perfil</span>
        </a></li>
      </ul>
    </nav>

    <div class="px-5 pb-5">
      <button class="flex w-full items-center justify-center gap-1.5 rounded-[10px] border border-borde px-3 py-2.5 text-sm text-tenue cursor-pointer transition-colors hover:bg-fondo hover:text-texto"
              id="btn-colapsar" type="button" aria-expanded="true">
        <span class="inline-flex transition-transform" data-icono-colapsar>‹</span>
        <span class="btn-colapsar-texto">Colapsar</span>
      </button>
    </div>

  </aside>

  <div class="flex h-[calc(100vh-2rem)] min-w-0 flex-1 flex-col gap-4 max-md:h-auto">

    <header class="barra-superior">
      <div class="flex items-center gap-3">
        <button class="h-7 w-7 rounded-lg text-xs text-debil cursor-pointer transition-colors hover:bg-fondo" type="button" data-size="small" aria-label="Fuente pequeña">A</button>
        <button class="h-7 w-7 rounded-lg text-sm text-debil cursor-pointer transition-colors hover:bg-fondo" type="button" data-size="medium" aria-label="Fuente mediana">A</button>
        <button class="h-7 w-7 rounded-lg text-base text-debil cursor-pointer transition-colors hover:bg-fondo" type="button" data-size="large" aria-label="Fuente grande">A</button>
        <button class="ctrl-tema btn-icono ml-1" type="button" id="btn-tema" aria-label="Cambiar tema">🌙</button>
      </div>

      <div class="topbar-usuario relative flex cursor-pointer items-center gap-3 rounded-xl border-l border-borde py-1 pl-5 pr-1.5 transition-colors hover:bg-fondo">
        <div class="usuario-avatar flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-primario text-xs font-bold text-white">MR</div>
        <div class="flex flex-col">
          <span class="usuario-nombre text-sm font-bold text-texto">Marcela</span>
          <span class="usuario-rol text-xs text-tenue">Administrador</span>
        </div>
        <div class="usuario-menu absolute right-0 top-[calc(100%+0.5rem)] z-40 hidden min-w-45 flex-col gap-0.5 rounded-xl border border-borde bg-superficie p-1.5 shadow-xl">
          <a href="../profile/profile.html" class="flex items-center gap-2 rounded-lg px-2.5 py-2 text-sm text-texto no-underline hover:bg-fondo">👤 Ver perfil</a>
          <a href="../auth/login.html" class="salir flex items-center gap-2 rounded-lg px-2.5 py-2 text-sm text-peligro no-underline hover:bg-fondo">↪ Cerrar sesión</a>
        </div>
      </div>
    </header>

    <main class="flex flex-col gap-6 overflow-y-auto px-8 py-7 max-md:px-4">

      <section class="flex items-center">
        <a href="../inventario/inventario.html" class="inline-flex items-center gap-2 text-lg font-bold text-texto no-underline transition-colors hover:text-primario">← Nuevo componente</a>
      </section>

      <section class="tarjeta flex max-w-2xl flex-col gap-6" aria-label="Formulario nuevo componente">
        <h2 class="border-b border-borde pb-4 text-base font-bold text-texto">Datos del componente</h2>

        <form class="formulario flex flex-col gap-5" novalidate>
          <p class="error-global" role="alert"></p>

          <div class="grid grid-cols-2 gap-4 max-sm:grid-cols-1">
            <div class="campo">
              <label class="etiqueta" for="nombre-componente">Nombre del componente</label>
              <input type="text" id="nombre-componente" class="control">
              <p class="campo-error"></p>
            </div>
            <div class="campo">
              <label class="etiqueta" for="modelo">Modelo</label>
              <input type="text" id="modelo" class="control">
              <p class="campo-error"></p>
            </div>
          </div>

          <div class="campo">
            <label class="etiqueta" for="fabricante">Fabricante</label>
            <input type="text" id="fabricante" class="control">
            <p class="campo-error"></p>
          </div>

          <div class="grid grid-cols-2 gap-4 max-sm:grid-cols-1">
            <div class="campo">
              <label class="etiqueta" for="serie">N° de serie</label>
              <input type="text" id="serie" class="control">
            </div>
            <div class="campo">
              <label class="etiqueta" for="part-number">Part number</label>
              <input type="text" id="part-number" class="control">
            </div>
          </div>

          <div class="flex flex-wrap gap-6">
            <label class="flex cursor-pointer items-center gap-2 text-sm text-texto">
              <input type="checkbox" name="es_fabrica" class="h-4 w-4 cursor-pointer accent-primario" checked>
              ¿Es de fábrica?
            </label>
            <label class="flex cursor-pointer items-center gap-2 text-sm text-texto">
              <input type="checkbox" name="funcionando" class="h-4 w-4 cursor-pointer accent-primario" checked>
              ¿Está funcionando?
            </label>
          </div>

          <div class="flex justify-end gap-3 pt-2 max-sm:flex-col-reverse">
            <a href="../inventario/inventario.html" class="btn-secundario max-sm:justify-center">Cancelar</a>
            <button type="submit" class="btn-primario max-sm:justify-center">Guardar</button>
          </div>
        </form>
      </section>

    </main>

  </div>

  <script src="../../js/utils/utils.js" defer></script>
  <script src="../../js/services/mock-data.js" defer></script>
  <script src="../../js/services/services.js" defer></script>
  <script src="../../js/components/components.js" defer></script>
  <script src="../../js/pages/nuevo-componente.js" defer></script>
  <script src="../../js/app.js" defer></script>

</body>
</html>
