<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGRSI — Iniciar sesión</title>
  <link rel="stylesheet" href="../../assets/css/app.css">
</head>
<body data-page="login" class="flex min-h-screen items-center justify-center p-4">

  <main class="flex w-full flex-col items-center gap-6 px-4 py-6">

    <header class="flex flex-col items-center gap-2.5 text-center">
      <img src="../../assets/img/logo.png" alt="Logo SGRSI" class="h-12 w-12 rounded-lg object-contain">
      <h1 class="text-2xl font-bold text-texto">Iniciá sesión</h1>
      <p class="text-base text-tenue">ITI CETP — Sistema de Gestión de Recursos</p>
    </header>

    <section class="w-full max-w-md rounded-2xl bg-superficie p-8 shadow-xl max-sm:p-6">
      <form class="login-form flex flex-col gap-5" novalidate>

        <p class="error-global" role="alert"></p>

        <div class="campo">
          <label class="etiqueta" for="cedula">Número de Cédula</label>
          <input type="text" id="cedula" class="control bg-fondo px-4 py-3" placeholder="Ej: 12345678"
                 maxlength="8" inputmode="numeric" autocomplete="username">
          <p class="campo-error"></p>
        </div>

        <div class="campo">
          <label class="etiqueta" for="contrasena">Contraseña</label>
          <div class="relative flex items-center">
            <input type="password" id="contrasena" class="control bg-fondo px-4 py-3 pr-12"
                   placeholder="Tu contraseña" autocomplete="current-password">
            <button type="button" id="toggle-password"
                    class="absolute right-3.5 flex cursor-pointer items-center border-none bg-transparent p-0 text-debil transition-colors hover:text-primario"
                    aria-label="Mostrar contraseña">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <p class="campo-error"></p>
        </div>

        <button type="submit" class="btn-ingresar w-full cursor-pointer rounded-full border-none bg-primario py-3.5 text-base font-bold text-white transition-colors hover:bg-primario-oscuro disabled:opacity-70">
          Ingresar
        </button>

      </form>
    </section>

    <footer>
      <p class="text-center text-sm text-debil">ITI CETP 2026 · Los accesos son gestionados por administración</p>
    </footer>

  </main>

  <script src="../../js/utils/utils.js" defer></script>
  <script src="../../js/services/mock-data.js" defer></script>
  <script src="../../js/services/services.js" defer></script>
  <script src="../../js/components/components.js" defer></script>
  <script src="../../js/pages/login.js" defer></script>
  <script src="../../js/app.js" defer></script>

</body>
</html>
